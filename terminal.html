<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPay Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 flex flex-col items-center">

    <!-- Экран регистрации / Авторизации -->
    <div id="screen-setup" class="w-full max-w-md bg-slate-900 p-6 rounded-3xl border border-slate-800 flex flex-col gap-4">
        <h2 class="text-xl font-bold text-blue-400">Настройка Терминала</h2>
        <input type="text" id="cfg-owner" placeholder="GitHub Username" class="p-3 bg-slate-950 border border-slate-700 rounded-xl text-sm outline-none">
        <input type="text" id="cfg-repo" placeholder="Имя репозитория (например: mpay)" class="p-3 bg-slate-950 border border-slate-700 rounded-xl text-sm outline-none">
        <input type="password" id="cfg-token" placeholder="GitHub Personal Access Token" class="p-3 bg-slate-950 border border-slate-700 rounded-xl text-sm outline-none">
        <button onclick="saveSetup()" class="py-3 bg-blue-600 font-bold rounded-xl hover:bg-blue-500">Сохранить настройки в кэш</button>
        <p class="text-xs text-slate-500 text-center">Токен сохранится только в локальной памяти вашего браузера.</p>
    </div>

    <!-- Основной Терминал -->
    <div id="screen-terminal" class="w-full max-w-md flex flex-col gap-4 hidden">
        <div class="flex justify-between items-center bg-slate-900/80 p-4 rounded-2xl border border-slate-800">
            <div>
                <h1 class="text-lg font-bold text-emerald-400">MPay Terminal</h1>
                <p id="term-sub" class="text-xs text-slate-400">Готов к работе</p>
            </div>
            <div class="relative">
                <button onclick="toggleMenu()" class="text-2xl p-2 text-slate-400 hover:text-white">⋮</button>
                <div id="dropdown-menu" class="hidden absolute right-0 mt-2 w-48 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl z-50 flex flex-col">
                    <button onclick="openModal('modal-add-card')" class="p-3 text-left text-sm hover:bg-slate-800">💳 Выпустить карту</button>
                    <button onclick="openModal('modal-topup')" class="p-3 text-left text-sm hover:bg-slate-800">💵 Пополнить карту</button>
                    <button onclick="resetSetup()" class="p-3 text-left text-sm text-rose-400 hover:bg-slate-800">⚙️ Сбросить Ключи</button>
                </div>
            </div>
        </div>

        <div class="bg-slate-900/80 p-6 rounded-3xl border border-slate-800 text-center">
            <span class="text-xs text-slate-400 uppercase">Сумма к оплате</span>
            <div class="text-5xl font-extrabold my-2"><span id="term-amount">0</span> <span class="text-2xl text-blue-400">EGP</span></div>
        </div>

        <!-- Цифровая клавиатура -->
        <div class="grid grid-cols-3 gap-3 bg-slate-900/80 p-4 rounded-3xl border border-slate-800">
            <button onclick="press('1')" class="py-4 text-2xl font-bold bg-slate-800 rounded-2xl">1</button>
            <button onclick="press('2')" class="py-4 text-2xl font-bold bg-slate-800 rounded-2xl">2</button>
            <button onclick="press('3')" class="py-4 text-2xl font-bold bg-slate-800 rounded-2xl">3</button>
            <button onclick="press('4')" class="py-4 text-2xl font-bold bg-slate-800 rounded-2xl">4</button>
            <button onclick="press('5')" class="py-4 text-2xl font-bold bg-slate-800 rounded-2xl">5</button>
            <button onclick="press('6')" class="py-4 text-2xl font-bold bg-slate-800 rounded-2xl">6</button>
            <button onclick="press('7')" class="py-4 text-2xl font-bold bg-slate-800 rounded-2xl">7</button>
            <button onclick="press('8')" class="py-4 text-2xl font-bold bg-slate-800 rounded-2xl">8</button>
            <button onclick="press('9')" class="py-4 text-2xl font-bold bg-slate-800 rounded-2xl">9</button>
            <button onclick="clearAmount()" class="py-4 text-lg font-bold bg-rose-950/60 text-rose-400 rounded-2xl">C</button>
            <button onclick="press('0')" class="py-4 text-2xl font-bold bg-slate-800 rounded-2xl">0</button>
            <button onclick="press('.')" class="py-4 text-2xl font-bold bg-slate-800 rounded-2xl">.</button>
        </div>

        <button onclick="generateQr()" class="w-full py-4 bg-indigo-600 font-bold rounded-2xl">Сгенерировать QR</button>
    </div>

    <!-- Модалка Выпуска Карты -->
    <div id="modal-add-card" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 hidden z-50">
        <div class="bg-slate-900 border border-slate-700 p-6 rounded-3xl w-full max-w-sm flex flex-col gap-3">
            <h3 class="text-lg font-bold text-emerald-400">Выпустить Карта</h3>
            <input type="text" id="new-uid" placeholder="UID Метки" class="p-3 bg-slate-950 border border-slate-700 rounded-xl text-sm outline-none">
            <input type="text" id="new-card-num" placeholder="Номер карты" class="p-3 bg-slate-950 border border-slate-700 rounded-xl text-sm outline-none">
            <div class="flex gap-2">
                <button onclick="closeModal('modal-add-card')" class="flex-1 py-3 bg-slate-800 rounded-xl font-bold">Отмена</button>
                <button onclick="submitNewCard()" class="flex-1 py-3 bg-emerald-600 rounded-xl font-bold">Создать</button>
            </div>
        </div>
    </div>

    <script>
        let currentInput = "0";
        let secretBuffer = "";

        window.onload = () => {
            if (localStorage.getItem('mpay_token')) {
                showTerminal();
            }
        };

        function saveSetup() {
            const owner = document.getElementById('cfg-owner').value.trim();
            const repo = document.getElementById('cfg-repo').value.trim();
            const token = document.getElementById('cfg-token').value.trim();
            if (!owner || !repo || !token) return alert("Заполните все поля!");

            localStorage.setItem('mpay_owner', owner);
            localStorage.setItem('mpay_repo', repo);
            localStorage.setItem('mpay_token', token);
            showTerminal();
        }

        function showTerminal() {
            document.getElementById('screen-setup').classList.add('hidden');
            document.getElementById('screen-terminal').classList.remove('hidden');
            document.getElementById('term-sub').innerText = "Repo: " + localStorage.getItem('mpay_repo');
        }

        function resetSetup() {
            localStorage.clear();
            location.reload();
        }

        function press(num) {
            secretBuffer += num;
            if (secretBuffer.endsWith("777")) {
                alert("Быстрый вход разработчика в настройки ключей");
                resetSetup();
                return;
            }
            if (currentInput === "0" && num !== ".") currentInput = "";
            currentInput += num;
            document.getElementById('term-amount').innerText = currentInput;
        }

        function clearAmount() { currentInput = "0"; document.getElementById('term-amount').innerText = "0"; }
        function toggleMenu() { document.getElementById('dropdown-menu').classList.toggle('hidden'); }
        function openModal(id) { toggleMenu(); document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        async function submitNewCard() {
            const uid = document.getElementById('new-uid').value.trim();
            const num = document.getElementById('new-card-num').value.trim();
            if (!uid || !num) return alert("Заполните поля!");

            const randomPin = Math.floor(1000 + Math.random() * 9000).toString();

            const res = await fetch(`https://api.github.com/repos/${localStorage.getItem('mpay_owner')}/${localStorage.getItem('mpay_repo')}/contents/cards/${num}.json`, {
                method: "PUT",
                headers: { 
                    "Authorization": `token ${localStorage.getItem('mpay_token')}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: "Create Card",
                    content: btoa(JSON.stringify({
                        uid: uid,
                        balance: 0,
                        rawPin: randomPin,
                        isBlocked: false,
                        frozenByClient: false
                    }, null, 2))
                })
            });

            if (res.ok) {
                alert(`Карта ${num} успешна создана! ПИН-код: ${randomPin}`);
                closeModal('modal-add-card');
            } else {
                alert("Ошибка сохранения на GitHub. Проверьте токен.");
            }
        }
    </script>
</body>
</html>
